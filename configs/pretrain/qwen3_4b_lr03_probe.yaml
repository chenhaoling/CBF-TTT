# Same equal-token data and BF16 FSDP2 path as qwen3_4b_smoke.yaml.
# Probe whether a smaller inner TTT rate improves early training stability.
model:
  model_path: /home/ctj/models/Qwen3-4B
  attn_implementation: sdpa
  foundation:
    ttt_layers: [0, 6, 12, 18, 24, 30, 35]
    ttt_mode: true
    ttt_proj: true
    ttt_target: hidden_states
    ttt_lr: 0.3
    ttt_chunk: 4096

data:
  train_path: /path/to/mixed_pretrain_pilot.jsonl
  train_size: 98304
  dataloader_type: native
  datasets_type: iterable
  data_type: plaintext
  max_seq_len: 6144
  text_keys: content_split
  drop_last: true

train:
  output_dir: /home/ctj/cbf_ttt_pretrain_qwen3_4b_lr03_probe
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 2
  micro_batch_size: 1
  rmpad: false
  use_wandb: false
  max_steps: 8
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: anyprecision_adamw
  lr: 5.0e-6
  lr_warmup_ratio: 0.02
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: false
  enable_gradient_checkpointing: true
  enable_full_shard: true
  enable_fsdp_offload: false
  init_device: meta
  ckpt_manager: dcp
  save_steps: 0
  save_epochs: 0
  save_hf_weights: false
