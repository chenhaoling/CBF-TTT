# 2xRTX5090 resource-constrained public-data baseline, Stage 2 (128K).
model:
  model_path: /path/to/2x5090_100m_stage1_no_ttt_hf_checkpoint
  foundation:
    max_position_embeddings: 131072
    rope_scaling:
      rope_type: yarn
      factor: 4.0
      original_max_position_embeddings: 32768
    ttt_layers: [0, 6, 12, 18, 24, 30]
    ttt_mode: false
    ttt_proj: true
    ttt_target: hidden_states
    ttt_lr: 3
    ttt_chunk: 4096

data:
  train_path: /path/to/public_corpus/stage2_128k.jsonl
  train_size: 41943040
  dataloader_type: native
  datasets_type: iterable
  data_type: plaintext
  max_seq_len: 131072
  text_keys: content_split
  drop_last: true
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true

train:
  output_dir: /path/to/output/2x5090_100m_stage2_no_ttt
  seed: 42
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 64
  micro_batch_size: 1
  rmpad: false
  use_wandb: false
  max_steps: 5
  num_train_epochs: 1
  rmpad_with_pos_ids: false
  dyn_bsz_margin: 0
  dyn_bsz: false
  optimizer: adamw
  lr: 5.0e-6
  lr_warmup_ratio: 0.02
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_activation_offload: true
  activation_gpu_limit: 0.0
  enable_full_shard: true
  enable_fsdp_offload: false
  init_device: meta
  ckpt_manager: dcp
  save_steps: 5
  save_epochs: 0
  save_hf_weights: true
